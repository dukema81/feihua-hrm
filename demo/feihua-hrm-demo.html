<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞花 HRM · Feihua HRM</title>
<style>:root {
  --bg: #0f1c26;
  --bar: #12262f;
  --bar2: #1a3540;
  --line: #d8dee4;
  --ink: #1f2d38;
  --muted: #6b7a88;
  --accent: #1f7a8c;
  --accent2: #2b9eb3;
  --gold: #c8963e;
  --up: #c0392b;
  --down: #1e8449;
  --warn: #b7791f;
  --bg-soft: #f4f7f9;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  font-size: 13px;
  color: var(--ink);
  background: var(--bg-soft);
}

a { color: var(--accent); text-decoration: none; }
.spacer { flex: 1; }
.mono { font-family: Consolas, "Courier New", monospace; }
.small { font-size: 12px; }
.muted { color: var(--muted); }
.num { text-align: right; font-family: Consolas, monospace; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--muted); }

/* ---------------------------------------------------------------- 应用骨架 */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-width: 1180px;
}

.titlebar {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 54px;
  padding: 0 14px;
  background: linear-gradient(180deg, #16323d, #10242c);
  color: #eaf2f5;
  border-bottom: 1px solid #0a171d;
}
.titlebar .brand { display: flex; align-items: center; gap: 10px; }
.titlebar .logo {
  width: 34px; height: 34px; line-height: 34px; text-align: center;
  background: linear-gradient(145deg, var(--accent2), var(--accent));
  border-radius: 8px; font-weight: 700; color: #fff; font-size: 17px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
}
.titlebar .co { font-size: 13px; font-weight: 600; letter-spacing: .5px; }
.titlebar .sys { font-size: 11px; color: #8fb0bd; margin-top: 2px; }
.titlebar .ver { font-size: 11px; color: #7f9dab; }
.titlebar .opuser { font-size: 12px; color: #cfe0e6; }
.titlebar .winbtns { display: flex; gap: 14px; margin-left: 12px; color: #9ab4bf; font-size: 12px; }
.titlebar .winbtns .close:hover { color: #ff8b7a; }

.menubar {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 36px;
  padding: 0 8px;
  background: var(--bar2);
  border-bottom: 1px solid #0d1e26;
}
.menubar button {
  background: transparent;
  border: 0;
  color: #cfe0e6;
  font-size: 12.5px;
  padding: 6px 13px;
  border-radius: 4px;
  cursor: pointer;
}
.menubar button:hover { background: rgba(255, 255, 255, .1); }
.menubar button.on { background: var(--accent); color: #fff; }

.body { display: flex; flex: 1; min-height: 0; }

.tree {
  width: 186px;
  background: #fff;
  border-right: 1px solid var(--line);
  overflow: auto;
  padding: 8px 0;
}
.tree-title {
  font-size: 11.5px; color: var(--muted); padding: 6px 14px 8px;
  border-bottom: 1px solid #eef1f4; margin-bottom: 6px;
}
.tree .grp { font-size: 12px; color: var(--muted); padding: 8px 14px 4px; }
.tree a {
  display: block; padding: 7px 14px 7px 24px; color: #33434f; font-size: 12.5px;
  border-left: 3px solid transparent;
}
.tree a:hover { background: #f2f7f9; }
.tree a.on { background: #e8f4f7; color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

.workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tabstrip {
  height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px;
  background: #e9eef2; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted);
}
.tabstrip .tab {
  background: #fff; border: 1px solid var(--line); border-bottom: 0;
  padding: 4px 12px; border-radius: 4px 4px 0 0; color: var(--ink);
}
.page { flex: 1; overflow: auto; padding: 12px; }

.side {
  width: 262px;
  background: #fff;
  border-left: 1px solid var(--line);
  overflow: auto;
  padding: 10px;
}
.side-block { border: 1px solid #e6ecf0; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
.side-block .hd {
  background: #f3f7f9; padding: 7px 10px; font-size: 12px; font-weight: 600;
  color: #3b4c58; border-bottom: 1px solid #e6ecf0;
}
.side-block .bd { padding: 9px 10px; }
.side-kv { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; }
.side-kv span { color: var(--muted); }

.statusbar {
  height: 26px; display: flex; align-items: center; gap: 18px; padding: 0 12px;
  background: #16323d; color: #b9cdd6; font-size: 11.5px;
}
.statusbar b { color: #eaf2f5; font-weight: 600; }

/* ---------------------------------------------------------------- 通用块 */
.panel {
  background: #fff; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px;
  box-shadow: 0 1px 2px rgba(16, 36, 44, .04);
}
.panel-title {
  padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: #2c3e4a;
  border-bottom: 1px solid #edf1f4; display: flex; align-items: center; gap: 8px;
}
.panel-body { padding: 12px; }
.panel-body.flush { padding: 0; }
.panel-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
.kpi-grid.six { grid-template-columns: repeat(6, 1fr); }
.kpi-grid.three { grid-template-columns: repeat(3, 1fr); }
.kpi {
  background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 11px 13px;
  border-top: 3px solid var(--accent);
}
.kpi.gold { border-top-color: var(--gold); }
.kpi.green { border-top-color: var(--down); }
.kpi.red { border-top-color: var(--up); }
.kpi .k-label { font-size: 11.5px; color: var(--muted); }
.kpi .k-value { font-size: 21px; font-weight: 700; margin-top: 5px; letter-spacing: -.3px; }
.kpi .k-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

table.grid-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.grid-table th {
  background: #f4f7f9; text-align: left; padding: 8px 10px; font-weight: 600;
  color: #46586a; border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.grid-table td { padding: 7px 10px; border-bottom: 1px solid #eef2f5; }
table.grid-table tbody tr:hover { background: #f8fbfc; }
table.grid-table tr.clickable { cursor: pointer; }
table.grid-table .empty-row td { text-align: center; color: var(--muted); padding: 26px; }
table.grid-table td.num, table.grid-table th.num { text-align: right; font-family: Consolas, monospace; }

.tag {
  display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
  background: #eef2f5; color: #55636f; line-height: 18px;
}
.tag.blue { background: #e3f1f5; color: #1f7a8c; }
.tag.green { background: #e6f4ec; color: #1e8449; }
.tag.red { background: #fbeae7; color: #c0392b; }
.tag.gold { background: #fbf2e0; color: #a9772a; }
.tag.gray { background: #eef2f5; color: #6b7a88; }

.btn {
  border: 1px solid var(--line); background: #fff; color: #33434f; padding: 5px 13px;
  border-radius: 4px; cursor: pointer; font-size: 12.5px;
}
.btn:hover { border-color: var(--accent2); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent2); }
.btn.danger { color: var(--up); border-color: #eccdc9; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 3px 9px; font-size: 12px; }

input[type=text], input[type=number], input[type=date], select, textarea {
  border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font-size: 12.5px;
  color: var(--ink); background: #fff; outline: none; font-family: inherit;
}
input:focus, select:focus { border-color: var(--accent2); }
.form-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.form-row label { font-size: 12px; color: var(--muted); }

.msg-list { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.msg-list .err { color: var(--up); }
.msg-list .warn { color: var(--warn); }
.msg-list .pass { color: var(--down); }

.progress {
  height: 6px; background: #eef2f5; border-radius: 3px; overflow: hidden; width: 90px;
  display: inline-block; vertical-align: middle;
}
.progress i { display: block; height: 100%; background: var(--accent2); }

.spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 20px; }
.spark i { width: 4px; display: block; background: #cfd8de; }

/* 抽屉 / 弹窗 */
.mask {
  position: fixed; inset: 0; background: rgba(10, 24, 30, .45); display: none;
  align-items: center; justify-content: center; z-index: 90;
}
.mask.on { display: flex; }
.dialog {
  background: #fff; border-radius: 8px; width: 860px; max-width: 94vw; max-height: 88vh;
  overflow: auto; box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
}
.dialog .dh {
  padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600;
  display: flex; align-items: center;
}
.dialog .dh .x { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 16px; }
.dialog .db { padding: 14px 16px; }
.dialog .df {
  padding: 11px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px;
  justify-content: flex-end;
}

/* 登录页 */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 20% 20%, #1d4453, #0c1a21 65%);
}
.login-card {
  width: 880px; display: flex; background: #fff; border-radius: 10px; overflow: hidden;
  box-shadow: 0 18px 60px rgba(0, 0, 0, .45);
}
.login-left {
  width: 420px; padding: 42px 36px; color: #eaf4f7;
  background: linear-gradient(160deg, #17505f, #0f2a34);
  display: flex; flex-direction: column;
}
.login-left .lg { font-size: 26px; font-weight: 700; letter-spacing: 4px; }
.login-left .sub { font-size: 12.5px; color: #9fc3cf; margin-top: 8px; line-height: 1.9; }
.login-left ul { margin: 22px 0 0; padding-left: 18px; font-size: 12px; color: #bcd6de; line-height: 2; }
.login-right { flex: 1; padding: 46px 40px; }
.login-right h2 { margin: 0 0 6px; font-size: 18px; }
.login-right .hint { font-size: 12px; color: var(--muted); margin-bottom: 22px; }
.login-right .field { margin-bottom: 14px; }
.login-right .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.login-right .field input { width: 100%; padding: 9px 11px; }
.login-right .btn.primary { width: 100%; padding: 9px; margin-top: 6px; font-size: 13.5px; }
.login-err { color: var(--up); font-size: 12px; min-height: 18px; margin-top: 8px; }
.login-demo { margin-top: 18px; font-size: 11.5px; color: var(--muted); line-height: 1.9; }

.chart-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); }
.chart-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }

/* ---------------------------------------------------------- 流程审批 */
.nav-badge { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 6px;
  background: var(--up, #c0392b); color: #fff; border-radius: 9px; font-size: 10.5px;
  line-height: 16px; text-align: center; font-weight: 600; }

.btn.xs { padding: 2px 8px; font-size: 11.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.apv-title { font-size: 15px; font-weight: 600; margin: 6px 0 4px; }

.apv-nodes { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
.apv-node { display: flex; gap: 8px; align-items: flex-start; min-width: 168px; flex: 1;
  border: 1px solid #e3eaef; border-radius: 6px; padding: 8px 10px; background: #fbfcfd; }
.apv-node.on { border-color: var(--accent2); background: #eff9fb; }
.apv-node.ok { border-color: #9ed3b4; background: #f2fbf6; }
.apv-node.no { border-color: #e6b0a8; background: #fdf4f2; }
.apv-node.skip { opacity: .55; }
.apv-dot { width: 18px; height: 18px; border-radius: 50%; background: #eef2f5; color: #6b7a88;
  font-size: 11px; line-height: 18px; text-align: center; flex: 0 0 18px; }
.apv-node.on .apv-dot { background: var(--accent2); color: #fff; }
.apv-node.ok .apv-dot { background: #1e8449; color: #fff; }
.apv-node.no .apv-dot { background: #c0392b; color: #fff; }
.apv-nb { min-width: 0; }
.apv-nm { font-size: 12.5px; font-weight: 600; }
.apv-cs { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.apv-chip { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: #eef2f5; color: #5d6f7c; }
.apv-chip.on { background: #fbf2e0; color: #a9772a; }
.apv-chip.no { background: #fbeae7; color: #c0392b; }

.apv-tl { border-left: 2px solid #e3eaef; margin-left: 6px; padding-left: 12px; }
.apv-ti { position: relative; padding: 3px 0 7px; font-size: 12px; }
.apv-ti::before { content: ""; position: absolute; left: -18px; top: 8px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent2); }
.apv-time { color: #8b9aa6; margin-right: 8px; }
.apv-act { font-weight: 600; margin-right: 6px; }
.apv-who { color: #33475b; margin-right: 6px; }
.apv-cm { color: #5d6f7c; margin: 3px 0 0 2px; line-height: 1.7; }

.apv-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 14px; font-size: 12.5px; }
.apv-form i { display: block; font-style: normal; color: #8b9aa6; font-size: 11px; }

.apv-ncard { border: 1px dashed #d6e0e7; border-radius: 6px; padding: 6px 10px 2px; margin-bottom: 8px; background: #fbfcfd; }
.apv-ncard .form-row { margin-bottom: 4px; }

/* ---------------------------------------------------------- CRM 组件 */
.kpi-grid.four { grid-template-columns: repeat(4, 1fr); }
.kpi-grid.five { grid-template-columns: repeat(5, 1fr); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: #fff; color: #4a5b68; border-radius: 14px;
  padding: 3px 11px; font-size: 12px; cursor: pointer;
}
.chip b { margin-left: 6px; color: var(--muted); font-weight: 600; }
.chip.on { background: #e8f4f7; border-color: var(--accent2); color: var(--accent); }
.chip.on b { color: var(--accent); }

.empty-hint { color: var(--muted); font-size: 12px; padding: 14px; text-align: center; }

/* 看板 */
.board { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
.board .col {
  flex: 1 0 200px; background: #f7fafb; border: 1px solid #e6ecf0; border-radius: 6px;
  padding: 8px; min-height: 220px;
}
.board .col-hd {
  font-size: 12px; font-weight: 600; color: #3b4c58; margin-bottom: 8px;
  display: flex; justify-content: space-between;
}
.board .col-hd span { font-weight: 400; color: var(--muted); font-size: 11px; }
.card {
  background: #fff; border: 1px solid #e3eaef; border-radius: 5px; padding: 8px 9px;
  margin-bottom: 7px; cursor: pointer; box-shadow: 0 1px 1px rgba(16, 36, 44, .03);
}
.card:hover { border-color: var(--accent2); box-shadow: 0 2px 8px rgba(31, 122, 140, .12); }
.card-t { font-size: 12.5px; font-weight: 600; color: #263943; line-height: 1.4; }
.card-c { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.card-m { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; font-size: 11.5px; }
.card-m b { font-size: 13px; color: #1f7a8c; }
.card-m span { color: var(--muted); }
.card-f { margin-top: 6px; font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

/* 漏斗 */
.funnel { display: flex; flex-direction: column; gap: 7px; }
.fn-row { display: grid; grid-template-columns: 150px 1fr 120px 60px; gap: 10px; align-items: center; }
.fn-name { font-size: 12.5px; color: #33434f; }
.fn-bar { height: 18px; background: #eef3f6; border-radius: 3px; overflow: hidden; }
.fn-bar i {
  display: block; height: 100%;
  background: linear-gradient(90deg, #2b9eb3, #1f7a8c);
}
.fn-val { font-size: 12px; text-align: right; font-family: Consolas, monospace; }
.fn-conv { font-size: 11.5px; color: var(--down); text-align: right; }
.funnel-mini { display: flex; gap: 10px; flex-wrap: wrap; }
.funnel-mini .fm {
  flex: 1 0 120px; border: 1px solid #e6ecf0; border-radius: 5px; padding: 8px 10px;
  background: #fbfdfe;
}
.funnel-mini .fm-v { font-size: 15px; font-weight: 700; color: #1f7a8c; }
.funnel-mini .fm-l { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

/* 时间线 */
.timeline { border-left: 2px solid #e3eaef; margin: 4px 0 4px 6px; padding-left: 12px; }
.tl-item { position: relative; padding: 3px 0 8px; font-size: 12px; color: #33434f; line-height: 1.7; }
.tl-item::before {
  content: ""; position: absolute; left: -17px; top: 9px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent2);
}
.tl-time { color: #8b9aa6; margin-right: 8px; font-family: Consolas, monospace; font-size: 11px; }

/* 详情头 */
.detail-head { display: flex; align-items: flex-start; gap: 12px; }
.dh-title { font-size: 16px; font-weight: 600; color: #22333d; }
.dh-tags { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.section-title {
  font-size: 12px; font-weight: 600; color: #3b4c58; margin: 14px 0 8px;
  border-left: 3px solid var(--accent2); padding-left: 8px;
}
.note {
  background: #f6f9fb; border: 1px solid #e6ecf0; border-radius: 5px; padding: 9px 11px;
  font-size: 12.5px; color: #42555f; line-height: 1.8; margin: 8px 0;
}
.warn-box {
  background: #fdf6e9; border: 1px solid #f0dcb8; color: #8a6420; border-radius: 5px;
  padding: 8px 11px; font-size: 12px; margin: 8px 0; line-height: 1.7;
}
.ok-box {
  background: #f1faf4; border: 1px solid #c9e8d5; color: #1e6b43; border-radius: 5px;
  padding: 8px 11px; font-size: 12px; margin: 8px 0; line-height: 1.7;
}
.form-grid { display: grid; grid-template-columns: 110px 1fr 110px 1fr; gap: 8px 10px; align-items: center; }
.form-grid label { font-size: 12px; color: var(--muted); text-align: right; }
.form-grid input, .form-grid select, .form-grid textarea { width: 100%; }
.gate { display: flex; flex-direction: column; gap: 5px; }
.gate-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0;
  border-bottom: 1px dashed #eef2f5; }

.score {
  display: inline-block; min-width: 28px; text-align: center; padding: 1px 6px;
  border-radius: 4px; font-size: 11.5px; font-weight: 700; font-family: Consolas, monospace;
}
.score.green { background: #e6f4ec; color: #1e8449; }
.score.blue { background: #e3f1f5; color: #1f7a8c; }
.score.gold { background: #fbf2e0; color: #a9772a; }
.score.red { background: #fbeae7; color: #c0392b; }

.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px;
  background: #eef2f5; color: #55636f; }
.pill.s2 { background: #fbf2e0; color: #a9772a; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.tabs button {
  border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 6px 14px;
  font-size: 12.5px; color: #55636f; cursor: pointer; border-radius: 4px 4px 0 0;
}
.tabs button.on { background: #fff; border-color: var(--line); color: var(--accent); font-weight: 600; }

.code {
  background: #0f2029; color: #d7e6ec; border-radius: 5px; padding: 9px 11px; font-size: 11.5px;
  font-family: Consolas, monospace; line-height: 1.7; overflow-x: auto; white-space: pre;
  margin: 6px 0 0;
}
code { background: #f1f5f8; padding: 1px 5px; border-radius: 3px; font-size: 11.5px;
  font-family: Consolas, monospace; color: #1f5f6d; }
.keybox {
  font-family: Consolas, monospace; font-size: 12.5px; background: #0f2029; color: #9ee6b8;
  padding: 12px; border-radius: 5px; word-break: break-all; margin: 8px 0;
}
.intg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  /* ---------------------------------------------------------- 请求 */
  F.raw = function (method, path, body, headers) {
    var h = { "Content-Type": "application/json" };
    var tk = localStorage.getItem(TOKEN_KEY);
    if (tk) { h.Authorization = "Bearer " + tk; h["X-Hr-Token"] = tk; }
    Object.keys(headers || {}).forEach(function (k) { h[k] = headers[k]; });
    var opt = { method: method, headers: h, credentials: "same-origin" };
    if (body !== undefined && body !== null) opt.body = JSON.stringify(body);
    return fetch(path.replace(/^\//, ""), opt).then(function (r) {
      return r.json().catch(function () { return { message: "响应解析失败" }; })
        .then(function (j) { return { status: r.status, body: j }; });
    });
  };

  F.api = function (method, path, body) {
    return F.raw(method, path, body).then(function (x) {
      if (x.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        location.href = "./login.html";
        return new Promise(function () {});
      }
      if (x.status >= 400) {
        var e = new Error((x.body && x.body.message) || ("请求失败 " + x.status));
        e.status = x.status;
        e.body = x.body;
        throw e;
      }
      return x.body;
    });
  };

  F.toast = function (msg, kind) {
    var el = document.getElementById("statusMsg");
    if (!el) return;
    el.textContent = msg;
    F._toastUntil = Date.now() + 6000;
    el.style.color = kind === "err" ? "#ffb3a7" : (kind === "ok" ? "#9ee6b8" : "");
    clearTimeout(F._t);
    F._t = setTimeout(function () { el.style.color = ""; }, 8000);
  };
  F.setStatus = function (t) {
    var el = document.getElementById("statusMsg");
    if (!el) return;
    if (F._toastUntil && Date.now() < F._toastUntil) return;
    el.textContent = t;
  };
  F.setSide = function (html) { var el = document.getElementById("side"); if (el) el.innerHTML = html; };

  F.can = function (perm) {
    var b = F.state.boot;
    return !!(b && b.user && (b.user.perms || []).indexOf(perm) >= 0);

  F.isAdmin = function () { return F.state.boot && F.state.boot.user.role === "admin"; };
  F.me = function () { return (F.state.boot && F.state.boot.user) || {}; };

  /* ---------------------------------------------------------- 路由 */
  function parseHash() {
    var h = (location.hash || "#dashboard").replace(/^#\/?/, "");
    var i = h.indexOf("?");
    var route = i < 0 ? h : h.slice(0, i);
    var qs = i < 0 ? "" : h.slice(i + 1);
    var params = {};
    qs.split("&").forEach(function (kv) {
      if (!kv) return;
      var j = kv.indexOf("=");
      params[decodeURIComponent(j < 0 ? kv : kv.slice(0, j))] =
        decodeURIComponent(j < 0 ? "" : kv.slice(j + 1));
    });
    return { route: route || "dashboard", params: params };
  }

  F.go = function (route, params) {
    location.hash = "#" + route + (params && Object.keys(params).length ? "?" + F.qs(params) : "");
  };

  var PAGES = {};
  F.register = function (name, fn) { PAGES[name] = fn; };

  function render() {
    var r = parseHash();
    F.state.route = r.route;
    F.state.params = r.params;
    if (F.state.timer) { clearInterval(F.state.timer); F.state.timer = null; }
    var fn = PAGES[r.route] || PAGES.dashboard;
    var view = document.getElementById("view");
    view.innerHTML = "";
    paintNav(r.route);
    try {
      fn(r.params);
    } catch (e) {
      view.innerHTML = '<div class="panel"><div class="panel-body">页面渲染失败：' +
        F.esc(e.message) + "</div></div>";
    }
  }
  F.render = render;

    perf: "绩效考核", jobs: "招聘管道", trainings: "培训管理", reports: "报表中心",

          F.esc(it[1]) + badge + "</a>";

  F.lineChart = function (series, opts) {
    opts = opts || {};
    var W = opts.width || 640, H = opts.height || 190, P = 34;
    var labels = opts.labels || [];
    var all = [];
    series.forEach(function (s) { all = all.concat(s.data); });
    var max = Math.max.apply(null, all.concat([1]));
    var min = opts.zero === false ? Math.min.apply(null, all) : 0;
    var span = max - min || 1;
    var colors = opts.colors || ["#1f7a8c", "#c8963e", "#b4463a"];
    var w = (W - P * 2) / Math.max(1, labels.length - 1);
    var grid = [0, 0.25, 0.5, 0.75, 1].map(function (t) {
      var y = P + (H - P * 1.6) * t;
      var val = max - span * t;
      return '<line x1="' + P + '" y1="' + y + '" x2="' + (W - P) + '" y2="' + y +
        '" stroke="#eef2f5"/><text x="6" y="' + (y + 4) + '" font-size="10" fill="#8b9aa6">' +
        (val >= 10000 ? (val / 10000).toFixed(1) + "万" : Math.round(val)) + "</text>";
    }).join("");
    var paths = series.map(function (s, si) {
      var d = s.data.map(function (v, i) {
        var x = P + w * i;
        var y = P + (H - P * 1.6) * (1 - (v - min) / span);
        return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }).join(" ");
      return '<path d="' + d + '" fill="none" stroke="' + colors[si % colors.length] +
        '" stroke-width="2"/>' + s.data.map(function (v, i) {
          var x = P + w * i;
          var y = P + (H - P * 1.6) * (1 - (v - min) / span);
          return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.6" fill="' +
            colors[si % colors.length] + '"/>';
        }).join("");
    }).join("");
    var xlabels = labels.map(function (t, i) {
      return '<text x="' + (P + w * i) + '" y="' + (H - 6) +
        '" font-size="10" fill="#8b9aa6" text-anchor="middle">' + F.esc(t) + "</text>";
    }).join("");
    var legend = series.map(function (s, si) {
      return '<span class="lg-dot"><i style="background:' + colors[si % colors.length] + '"></i>' +
        F.esc(s.name) + "</span>";
    }).join("");
    return '<div class="chart-legend">' + legend + "</div>" +
      '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '">' +
      grid + paths + xlabels + "</svg>";
  };

  F.barChart = function (items, opts) {
    opts = opts || {};
    var W = opts.width || 640, H = opts.height || 180, P = 34;
    var max = Math.max.apply(null, items.map(function (i) { return i.value; }).concat([1]));
    var gap = (W - P * 2) / Math.max(1, items.length);
    var bw = gap * 0.56;
    return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '">' +
      items.map(function (it, i) {
        var h = (H - P * 1.8) * (it.value / max);
        var x = P + gap * i + (gap - bw) / 2;
        var y = H - P - h;
        return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) +
          '" height="' + Math.max(1, h).toFixed(1) + '" rx="2" fill="' + (it.color || "#2b9eb3") + '"/>' +
          '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 5) +
          '" font-size="10" fill="#5d6f7c" text-anchor="middle">' + F.esc(it.label2 || "") +
          "</text>" + '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) +
          '" font-size="10" fill="#8b9aa6" text-anchor="middle">' + F.esc(it.label) + "</text>";
      }).join("") + "</svg>";

          { label: "主题", render: function (r) { return "<b>" + F.esc(r.title) + "</b>"; } },
          { label: "分类", render: function (r) { return F.tag(r.category, "blue"); } },
          { label: "讲师", key: "trainer" },
          { label: "日期", render: function (r) { return '<span class="mono small">' + F.esc(r.date) + "</span>"; } },
          { label: "学时", num: true, key: "hours" },
          { label: "报名/名额", num: true, render: function (r) { return r.enrolled + " / " + r.quota; } },
          { label: "状态", render: function (r) { return F.tag(r.status); } }
        ], d.list, { click: function (r) { return r.no; }, empty: "无培训" }) + "</div></div>";
      document.getElementById("view").innerHTML = html;

      F.bindRows(document, function (no) {
        F.api("GET", "/api/trainings/" + no + "/records").then(function (r) {
          var body = F.table([
            { label: "工号", render: function (r2) { return '<span class="mono">' + F.esc(r2.emp_no) + "</span>"; } },
            { label: "姓名", key: "name" },
            { label: "状态", render: function (r2) { return F.tag(r2.status); } },
            { label: "成绩", num: true, render: function (r2) { return r2.score || "—"; } }
          ], r.list, { empty: "暂无报名" }) +
          (F.can("org.write") ? '<div class="form-foot"><button class="btn" id="trEnroll">为员工报名</button>' +
            '<button class="btn primary" id="trGrade">录入成绩</button></div>' : "");
          F.dialogWide("培训详情 · " + no, body);
          var e1 = document.getElementById("trEnroll");
          if (e1) e1.addEventListener("click", function () {
            F.dialog("培训报名",
              '<div class="form-grid"><label>工号<input id="teEmp" value="EMP009"></label></div>',
              '<button class="btn primary" id="teOk">报名</button>');
            document.getElementById("teOk").addEventListener("click", function () {
              F.api("POST", "/api/trainings/" + no + "/enroll",
                { emp: document.getElementById("teEmp").value.trim() })
                .then(function () {
                  F.closeDialog(); document.getElementById("mask").className = "mask";
                  F.toast("报名成功", "ok"); F.go("trainings");
                }).catch(function (er) { F.toast(er.message, "err"); });
            });
          });
          var e2 = document.getElementById("trGrade");
          if (e2) e2.addEventListener("click", function () {
            F.dialog("录入成绩",
              '<div class="form-grid">' +
              '<label>工号<input id="tgEmp" value="EMP009"></label>' +
              '<label>成绩<input id="tgScore" type="number" value="88" min="0" max="100"></label></div>',
              '<button class="btn primary" id="tgOk">保存</button>');
            document.getElementById("tgOk").addEventListener("click", function () {
              F.api("POST", "/api/trainings/" + no + "/grade", {
                emp: document.getElementById("tgEmp").value.trim(),
                score: Number(document.getElementById("tgScore").value || 0)
              }).then(function () {
                F.closeDialog(); document.getElementById("mask").className = "mask";
                F.toast("成绩已录入", "ok"); F.go("trainings");
              }).catch(function (er) { F.toast(er.message, "err"); });
            });
          });
        }).catch(function (e) { F.toast(e.message, "err"); });
      });

      var nb = document.getElementById("trNew");
      if (nb) nb.addEventListener("click", function () {
        F.dialog("新建培训",
          '<div class="form-grid">' +
          '<label>主题<input id="tnTitle"></label>' +
          '<label>分类<select id="tnCat"><option>技能</option><option>入职</option>' +
          "<option>合规</option><option>管理</option></select></label>" +
          '<label>讲师<input id="tnTrainer"></label>' +
          '<label>日期<input id="tnDate" type="date" value="' + F.today() + '"></label>' +
          '<label>学时<input id="tnHours" type="number" value="2"></label>' +
          '<label>名额<input id="tnQuota" type="number" value="30"></label></div>',
          '<button class="btn primary" id="tnOk">创建</button>');
        document.getElementById("tnOk").addEventListener("click", function () {
          F.api("POST", "/api/trainings", {
            title: document.getElementById("tnTitle").value.trim(),
            category: document.getElementById("tnCat").value,
            trainer: document.getElementById("tnTrainer").value.trim(),
            date: document.getElementById("tnDate").value,
            hours: Number(document.getElementById("tnHours").value || 2),
            quota: Number(document.getElementById("tnQuota").value || 30)
          }).then(function (r) {
            F.closeDialog(); F.toast("培训 " + r.no + " 已创建", "ok"); F.go("trainings");
          }).catch(function (e) { F.toast(e.message, "err"); });
        });
      });
      F.setStatus("培训管理 · " + d.list.length + " 场");
      F.setSide('<div class="side-block"><div class="hd">口径</div><div class="bd small muted" ' +
        'style="line-height:1.9">报名闸口：名额满员拦截；成绩 ≥ 60 记已完成，&lt;60 记缺席；' +
        "同一员工同一培训不可重复报名。</div></div>");
    }).catch(function (e) { F.toast(e.message, "err"); });
  });
})(window, document);

/* 飞花 HRM · 报表中心 / 集成中心 */
(function (window, document) {
  "use strict";
  var F = window.F;

  /* ---------------------------------------------------------- 报表中心 */
  F.register("reports", function () {
    Promise.all([F.api("GET", "/api/reports/headcount"), F.api("GET", "/api/attendance/report")])
      .then(function (res) {
        var hc = res[0], att = res[1];
        var html = '<div class="kpi-grid four">' +
          '<div class="kpi"><div class="k-label">在职人数</div><div class="k-value">' + hc.total +
          '</div><div class="k-sub">编制 ' + hc.plan + "</div></div>" +
          '<div class="kpi gold"><div class="k-label">离职人数</div><div class="k-value">' + hc.leavers +
          '</div><div class="k-sub">离职率 ' + F.pct0(hc.turnRate * 100) + "</div></div>" +
          '<div class="kpi green"><div class="k-label">本月出勤率</div><div class="k-value">' +
          F.pct0((att.list.reduce(function (s, x) { return s + x.rate; }, 0) /
            Math.max(1, att.list.length)) * 100) + "</div></div>" +
          '<div class="kpi"><div class="k-label">部门数</div><div class="k-value">' +
          hc.byDept.length + "</div></div></div>";

        html += '<div class="panel"><div class="panel-title">部门人数分布' +
          '<span class="panel-actions"><a class="btn sm" href="#orgs">组织架构</a></span></div>' +
          '<div class="panel-body">' + F.barChart(hc.byDept.map(function (x) {
            return { label: x.dept, value: x.count };
          })) + "</div></div>";

        html += '<div class="panel"><div class="panel-title">职级分布</div><div class="panel-body flush">' +
          F.table([
            { label: "职级", render: function (r) { return F.tag(r.level, "blue"); } },
            { label: "人数", num: true, key: "count" }
          ], hc.byLevel) + "</div></div>";

        html += '<div class="panel"><div class="panel-title">数据导出（CSV）</div><div class="panel-body">' +
          '<div class="row-flex">' +
          '<a class="btn" href="api/reports/attendance.csv">考勤明细</a>' +
          '<a class="btn" href="api/reports/leaves.csv">请假记录</a>' +
          '<a class="btn" href="api/reports/payslips.csv">工资条（需薪资权限）</a>' +
          "</div></div></div>";
        document.getElementById("view").innerHTML = html;
        F.setStatus("报表中心 · 在职 " + hc.total + " 人");
        F.setSide('<div class="side-block"><div class="hd">说明</div><div class="bd small muted" ' +
          'style="line-height:1.9">CSV 带品牌名下载（UTF-8 BOM，Excel 直开）；' +
          "工资条导出需要 pay.read 权限；离职率 = 离职人数 /（在职 + 离职）。</div></div>");
      }).catch(function (e) { F.toast(e.message, "err"); });
  });

  /* ---------------------------------------------------------- 集成中心 */
  F.register("integration", function () {
    var tab = F.state.params.tab || "keys";
    Promise.all([F.api("GET", "/api/keys"), F.api("GET", "/api/webhooks"),
      F.api("GET", "/api/webhooks/deliveries")]).then(function (res) {
      var keys = res[0], wh = res[1], dv = res[2];
      var html = '<div class="panel"><div class="panel-title">' +
        F.chips([["keys", "API Key"], ["hooks", "Webhook"], ["deliveries", "投递记录"],
          ["sync", "增量同步"]], tab, "data-tab") +
        '</div><div class="panel-body" id="intBody"></div></div>';
      document.getElementById("view").innerHTML = html;
      var body = document.getElementById("intBody");

      function paint(t) {
        if (t === "keys") {
          body.innerHTML = (F.isAdmin() ? '<div class="form-foot" style="justify-content:flex-start">' +
            '<button class="btn primary" id="ikNew">生成 API Key</button></div>' : "") +
            F.table([
              { label: "前缀", render: function (r) { return '<span class="mono secret-box">' + F.esc(r.prefix) + "</span>"; } },
              { label: "名称", key: "name" },
              { label: "范围", render: function (r) { return F.tag(r.scope === "write" ? "读写" : "只读",
                  r.scope === "write" ? "blue" : "gray"); } },
              { label: "创建时间", render: function (r) { return '<span class="mono small">' + F.esc(r.created) + "</span>"; } },
              { label: "最近使用", render: function (r) { return '<span class="mono small">' + F.esc(F.dash(r.last_used)) + "</span>"; } },
              { label: "状态", render: function (r) { return r.revoked ? F.tag("吊销") : F.tag("启用"); } }
            ], keys.list) +
            '<div class="sub-title">调用方式</div>' +
            '<div class="panel-body small muted" style="line-height:2">' +
            "请求头携带 <code>X-Hr-Key: fhk_xxx</code>；read 范围只能 GET，write 可全量读写；" +
            "Key 以 SHA-256 哈希落库，明文只在创建时返回一次。</div>";
          var nb = document.getElementById("ikNew");
          if (nb) nb.addEventListener("click", function () {
            F.dialog("生成 API Key",
              '<div class="form-grid">' +
              '<label>名称<input id="ikName" value="对接系统"></label>' +
              '<label>范围<select id="ikScope"><option value="read">只读</option>' +
              '<option value="write">读写</option></select></label></div>',
              '<button class="btn primary" id="ikOk">生成</button>');
            document.getElementById("ikOk").addEventListener("click", function () {
              F.api("POST", "/api/keys", {
                name: document.getElementById("ikName").value.trim(),
                scope: document.getElementById("ikScope").value
              }).then(function (r) {
                F.dialog("密钥已生成（仅显示一次）",
                  '<div class="secret-box mono" style="word-break:break-all">' + F.esc(r.key) + "</div>",
                  '<button class="btn primary" id="ikDone">我已保存</button>');
                document.getElementById("ikDone").addEventListener("click", function () {
                  F.closeDialog(); F.go("integration", { tab: "keys" });
                });
              }).catch(function (e) { F.toast(e.message, "err"); });
            });
          });
        } else if (t === "hooks") {
          body.innerHTML = (F.isAdmin() ? '<div class="form-foot" style="justify-content:flex-start">' +
            '<button class="btn primary" id="whNew">新建 Webhook</button> ' +
            '<button class="btn" id="whTest">发送 test.ping</button></div>' : "") +
            F.table([
              { label: "名称", key: "name" },
              { label: "回调地址", render: function (r) { return '<span class="mono small">' + F.esc(r.url) + "</span>"; } },
              { label: "订阅事件", render: function (r) {
                  return (r.events || "").split(",").filter(Boolean).map(function (e) {
                    return '<span class="tag gray">' + F.esc(e) + "</span>"; }).join(" "); } },
              { label: "状态", render: function (r) { return r.enabled ? F.tag("启用") : F.tag("停用"); } }
            ], wh.list) +
            '<div class="sub-title">签名协议</div>' +
            '<div class="panel-body small muted" style="line-height:2">' +
            "回调头：<code>X-Hr-Event</code> / <code>X-Hr-Timestamp</code> / " +
            "<code>X-Hr-Signature = HMAC-SHA256(secret, ts + \".\" + body)</code>；" +
            "失败按 30/60/120 秒退避重试 3 次。共 " + (wh.events || []).length + " 种事件。</div>";
          var wn = document.getElementById("whNew");
          if (wn) wn.addEventListener("click", function () {
            F.dialog("新建 Webhook",
              '<div class="form-grid">' +
              '<label>名称<input id="whName" value="OA 系统"></label>' +
              '<label class="full">回调地址<input id="whUrl" placeholder="https://..."></label>' +
              '<label class="full">事件（逗号分隔，空格留全部可从下方选择）' +
              '<input id="whEvents" value="employee.created,leave.approved"></label></div>',
              '<button class="btn primary" id="whOk">创建</button>');
            document.getElementById("whOk").addEventListener("click", function () {
              F.api("POST", "/api/webhooks", {
                name: document.getElementById("whName").value.trim(),
                url: document.getElementById("whUrl").value.trim(),
                events: document.getElementById("whEvents").value.split(",").map(function (s) {
                  return s.trim(); }).filter(Boolean)
              }).then(function (r) {
                F.dialog("Webhook 已创建（secret 仅显示一次）",
                  '<div class="secret-box mono" style="word-break:break-all">' + F.esc(r.secret) + "</div>",
                  '<button class="btn primary" id="whDone">我已保存</button>');
                document.getElementById("whDone").addEventListener("click", function () {
                  F.closeDialog(); F.go("integration", { tab: "hooks" });
                });
              }).catch(function (e) { F.toast(e.message, "err"); });
            });
          });
          var wt = document.getElementById("whTest");
          if (wt) wt.addEventListener("click", function () {
            F.api("POST", "/api/webhooks/test", {}).then(function () {
              F.toast("test.ping 已入队投递", "ok"); F.go("integration", { tab: "deliveries" });
            }).catch(function (e) { F.toast(e.message, "err"); });
          });
        } else if (t === "deliveries") {
          body.innerHTML = F.table([
            { label: "事件", render: function (r) { return '<span class="tag blue">' + F.esc(r.event) + "</span>"; } },
            { label: "目标", render: function (r) { return F.esc(F.dash(r.name)); } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "尝试", num: true, key: "attempts" },
            { label: "最近时间", render: function (r) { return '<span class="mono small">' + F.esc(F.dash(r.last_at)) + "</span>"; } }
          ], dv.list, { empty: "暂无投递记录" });
        } else {
          body.innerHTML =
            '<div class="sub-title">增量同步游标拉取</div>' +
            '<div class="panel-body small muted" style="line-height:2">' +
            "GET <code>/api/sync/changes?since=2026-10-01 00:00:00&amp;limit=200</code><br>" +
            "返回 employees / leaves / attendance 三类变更，配合 next 游标轮询，单页上限 500。</div>" +
            '<div class="form-foot"><button class="btn primary" id="syncTry">试拉一次</button></div>' +
            '<div id="syncOut" class="mono small"></div>';
          document.getElementById("syncTry").addEventListener("click", function () {
            F.api("GET", "/api/sync/changes?since=" +
              encodeURIComponent(new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 19).replace("T", " ")))
              .then(function (r) {
                document.getElementById("syncOut").textContent = JSON.stringify({
                  employees: (r.changes.employees || []).length,
                  leaves: (r.changes.leaves || []).length,
                  attendance: (r.changes.attendance || []).length,
                  next: r.next
                }, null, 2);
              }).catch(function (e) { F.toast(e.message, "err"); });
          });
        }
      }
      paint(tab);
      document.querySelectorAll("[data-tab]").forEach(function (b) {
        b.addEventListener("click", function () {
          document.querySelectorAll("[data-tab]").forEach(function (x) { x.className = "chip"; });
          b.className = "chip on";
          paint(b.getAttribute("data-tab"));
        });
      });
      F.setStatus("集成中心");
      F.setSide('<div class="side-block"><div class="hd">三通道对接</div><div class="bd small muted" ' +
        'style="line-height:1.9">● API Key：fhk_ 前缀，read/write 范围<br>● Webhook：HMAC-SHA256 签名，14 种事件<br>' +
        "● 增量同步：游标拉取，供数仓/中台定时同步</div></div>");
    }).catch(function (e) { F.toast(e.message, "err"); });
  });
})(window, document);
</script>
<div style="position:fixed;right:10px;bottom:10px;z-index:999;background:#1f7a8c;color:#fff;font-size:11px;padding:3px 10px;border-radius:10px;opacity:.85">离线 DEMO · 数据存于浏览器内存</div></body>
</html>
