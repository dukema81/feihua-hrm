<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞花 HRM · Feihua HRM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="brand">
      <div class="logo">花</div>
      <div>
        <div class="co">飞花科技集团（苏州）有限公司</div>
        <div class="sys">飞花 HRM · 人力资源管理系统</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="ver" id="verNo">feihua-hrm-1.0.0</div>
    <span class="opuser link-out" id="btnLogout" title="退出登录" style="cursor:pointer">退出</span>
    <div class="winbtns"><span>—</span><span>□</span><span class="close">×</span></div>
  </header>

  <nav class="menubar" id="menubar"></nav>

  <div class="body">
    <aside class="tree">
      <div class="tree-title"><span style="color:var(--accent2)">■</span> 功能导航</div>
      <div id="tree"></div>
    </aside>

    <section class="workspace">
      <div class="tabstrip" id="tabstrip"></div>
      <div class="page" id="view"></div>
    </section>

    <aside class="side" id="side"></aside>
  </div>

  <footer class="statusbar">
    <span id="statusMsg">就绪</span>
    <span class="spacer"></span>
    <span>法人：<b>飞花科技集团（苏州）有限公司</b></span>
    <span id="hcLabel">在职：—</span>
    <span id="leaveLabel">待审批请假：—</span>
    <span id="jobLabel">在招职位：—</span>
    <span id="opFoot">操作员：—</span>
  </footer>
</div>

<div class="mask" id="mask"><div class="dialog" id="dialog"></div></div>

<script src="app.js"></script>
<script src="org.js"></script>
<script src="time.js"></script>
<script src="pay.js"></script>
<script src="hire.js"></script>
<script src="sys.js"></script>
</body>
</html>
